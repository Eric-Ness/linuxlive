# Temporary probe (branch arm-probe only): what GitHub's arm64 runners offer
# for building and boot-testing aarch64 ISOs. Not for main.
name: spike
on:
  workflow_dispatch:
    inputs:
      keep_iso: {type: boolean, default: false}
      publish: {type: boolean, default: false}
      only: {type: string, default: ""}
permissions:
  contents: read
jobs:
  probe:
    runs-on: ubuntu-24.04-arm
    steps:
      - run: |
          uname -a; nproc; free -g; df -h /
          ls -l /dev/kvm || echo "NO KVM"
          grep -c . /proc/cpuinfo; head -20 /proc/cpuinfo
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends qemu-system-arm qemu-efi-aarch64 ovmf qemu-utils >/dev/null
          ls -l /usr/share/AAVMF/ /usr/share/qemu-efi-aarch64/ 2>/dev/null
          qemu-system-aarch64 --version
          podman --version
          podman pull --arch arm64 quay.io/fedora/fedora-silverblue:44 >/dev/null && echo "silverblue arm64 ok"
          podman pull quay.io/fedora-ostree-desktops/base-atomic:44 >/dev/null && echo "base-atomic arm64 ok"
          podman run --rm docker.io/library/ubuntu:26.04 sh -c 'apt-get update -qq && apt-cache policy shim-signed grub-efi-arm64-signed linux-image-generic | grep -E "^[a-z]|Candidate"'
          # How fast is TCG here? Boot the AAVMF firmware to its shell for 60 s.
          if [ -e /dev/kvm ]; then accel="-accel kvm -cpu host"; else accel="-accel tcg,thread=multi -cpu max"; fi
          cp /usr/share/AAVMF/AAVMF_VARS.fd vars.fd
          timeout 60 qemu-system-aarch64 -machine virt $accel -m 2048 -smp 4 -nographic \
            -drive if=pflash,format=raw,readonly=on,file=/usr/share/AAVMF/AAVMF_CODE.fd -drive if=pflash,format=raw,file=vars.fd | tail -5 || true
