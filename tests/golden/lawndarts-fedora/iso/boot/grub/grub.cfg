# Generated by linuxlive 0.9.1 from spec 'lawn-darts-linux' (Fedora 44, Cinnamon).
# Do not edit by hand: change the spec and compile again.

set default=0
set timeout=5
set timeout_style=menu

# BIOS PCs (and VMs in BIOS mode) start Linux in text mode, so the boot splash
# has nothing to draw on until the graphics driver loads; start it in a
# graphical mode instead. UEFI firmware hands Linux one already. Safe graphics
# keeps text.
if [ "$grub_platform" = "pc" ]; then
	insmod all_video
	set gfxpayload=auto
fi

menuentry 'Try Lawn Darts Linux 0.1' --id try {
	linux /live/vmlinuz root=live:CDLABEL=LAWN_DARTS_LINUX_0_1 rd.live.image rd.live.overlay.overlayfs=1 quiet rhgb
	initrd /live/initrd.img
}

menuentry 'Install Lawn Darts Linux 0.1' --id install {
	linux /live/vmlinuz linuxlive.install root=live:CDLABEL=LAWN_DARTS_LINUX_0_1 rd.live.image rd.live.overlay.overlayfs=1 quiet rhgb
	initrd /live/initrd.img
}

menuentry 'Try Lawn Darts Linux 0.1 (safe graphics)' --id safe {
	set gfxpayload=text
	linux /live/vmlinuz nomodeset root=live:CDLABEL=LAWN_DARTS_LINUX_0_1 rd.live.image rd.live.overlay.overlayfs=1 quiet rhgb
	initrd /live/initrd.img
}

if [ "$grub_platform" = "efi" ]; then
	menuentry 'UEFI firmware settings' --id uefi-firmware {
		fwsetup
	}
fi
