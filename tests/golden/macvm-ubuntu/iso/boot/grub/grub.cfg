# Generated by linuxlive 0.9.1 from spec 'testos-arm' (Ubuntu 26.04 LTS, GNOME).
# Do not edit by hand: change the spec and compile again.

set default=0
set timeout=5
set timeout_style=menu

# BIOS PCs (and VMs in BIOS mode) start Linux in text mode, so the boot splash
# has nothing to draw on until the graphics driver loads; start it in a
# graphical mode instead. UEFI firmware hands Linux one already. Safe graphics
# keeps text.
if [ "$grub_platform" = "pc" ]; then
	insmod all_video
	set gfxpayload=auto
fi

menuentry 'Try TestOS ARM 0.1' --id try {
	linux /casper/vmlinuz boot=casper quiet splash ---
	initrd /casper/initrd
}

menuentry 'Install TestOS ARM 0.1' --id install {
	linux /casper/vmlinuz linuxlive.install boot=casper quiet splash ---
	initrd /casper/initrd
}

menuentry 'Try TestOS ARM 0.1 (safe graphics)' --id safe {
	set gfxpayload=text
	linux /casper/vmlinuz nomodeset boot=casper quiet splash ---
	initrd /casper/initrd
}

if [ "$grub_platform" = "efi" ]; then
	menuentry 'UEFI firmware settings' --id uefi-firmware {
		fwsetup
	}
fi
