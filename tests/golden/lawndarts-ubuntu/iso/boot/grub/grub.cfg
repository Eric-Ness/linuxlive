set default=0
set timeout=5
set timeout_style=menu

menuentry 'Try Lawn Darts Linux 0.1' --id try {
	linux /casper/vmlinuz boot=casper quiet splash ---
	initrd /casper/initrd
}

menuentry 'Install Lawn Darts Linux 0.1' --id install {
	linux /casper/vmlinuz linuxlive.install boot=casper quiet splash ---
	initrd /casper/initrd
}

menuentry 'Try Lawn Darts Linux 0.1 (safe graphics)' --id safe {
	linux /casper/vmlinuz nomodeset boot=casper quiet splash ---
	initrd /casper/initrd
}

if [ "$grub_platform" = "efi" ]; then
	menuentry 'UEFI firmware settings' --id uefi-firmware {
		fwsetup
	}
fi
