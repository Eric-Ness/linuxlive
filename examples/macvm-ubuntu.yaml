# Example spec: TestOS for ARM64, Ubuntu 26.04 with GNOME, for virtual machines
# on Apple-silicon Macs (UTM, Parallels, VMware Fusion). CI builds it on an
# arm64 runner and boot-tests it emulated, in UEFI modes.
schema_version: 1
name: TestOS ARM
id: testos-arm
version: "0.1"
base: ubuntu
desktop: gnome
arches: [arm64]
apps:
  - firefox
  - vlc
branding:
  wallpaper: assets/wallpaper.png
  logo: assets/logo.png
  accent_color: "#c2185b"
